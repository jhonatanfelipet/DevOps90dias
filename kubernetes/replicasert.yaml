apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: miejemplo-uno-rs
  labels:
    app: portfolio-web
    version: "v1"
spec:
  template:
    metadata:
      labels:
        app: portfolio-web
        version: "v1"
    spec:
      containers:
      - name: mi-contenedor
        image: httpd:2.4
  replicas: 4
  selector:
    matchLabels:
      app: portfolio-web
      version: "v1"